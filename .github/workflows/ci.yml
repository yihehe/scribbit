name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Toolchain
        run: |
          sw_vers
          swift --version
      - name: Validate scripts and metadata
        run: |
          for script in Scripts/*.sh Tests/Scripts/*.sh; do
            /bin/bash -n "$script"
          done
          plutil -lint Resources/Info.plist
          git diff --check
      - name: Test shell runner compatibility
        run: /bin/bash Tests/Scripts/test-runner.sh
      - name: Test development publisher (offline)
        run: python3 -m unittest discover -s Tests/CI -v
      - name: Unit and filesystem tests
        run: Scripts/test.sh
      - name: Build and verify signed app
        run: Scripts/build-app.sh
      - name: Package development app
        id: package
        run: |
          Scripts/package-app.sh
          echo "artifact=Scribbit-${RUNNER_OS}-${RUNNER_ARCH}-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - name: Keep this build with repository-default retention
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ steps.package.outputs.artifact }}
          path: |
            build/development/Scribbit-macOS.zip
            build/development/build-metadata.json
          if-no-files-found: error
          compression-level: 0
    outputs:
      artifact: ${{ steps.package.outputs.artifact }}

  development-release:
    needs: macos
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: rolling-development-release
      cancel-in-progress: false
    steps:
      - name: Check out trusted main-push source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Download this run's tested build
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: ${{ needs.macos.outputs.artifact }}
          path: build/development
      - name: Publish rolling development prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 Scripts/publish-development.py build/development
