<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img"><title>F · Curious Tilt</title><desc>Original Night Paper variation. A curious little head tilt. Raised eye, upward glance, energetic diagonal pencil. Editable layered vector geometry; no raster images.</desc><defs><filter id="f-paper-grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency=".48 .72" numOctaves="3" seed="29" stitchTiles="stitch" result="paperNoise"/>
    <feDiffuseLighting in="paperNoise" surfaceScale="1.2" diffuseConstant=".9" lighting-color="#FFFFFF" result="paperRelief"><feDistantLight azimuth="225" elevation="55"/></feDiffuseLighting>
    <feComponentTransfer in="paperRelief" result="paperTone"><feFuncR type="linear" slope=".30" intercept=".79"/><feFuncG type="linear" slope=".30" intercept=".79"/><feFuncB type="linear" slope=".30" intercept=".79"/></feComponentTransfer>
    <feBlend in="SourceGraphic" in2="paperTone" mode="multiply" result="texturedArt"/>
    <feComposite in="texturedArt" in2="SourceAlpha" operator="in"/>
    </filter></defs><g id="f-textured-paper-artwork" filter="url(#f-paper-grain)"><defs>
